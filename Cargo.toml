[package]
name = "modular-agent-monty"
version = "0.3.0"
description = "Monty Agents for Modular Agent"
authors = ["Akira Ishino <akira@lumilab.jp>"]
edition = "2024"
license = "Apache-2.0 OR MIT"

[dependencies]
im = "15.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

modular-agent-core = "0.25.0"
monty = { git = "https://github.com/pydantic/monty" }
# get-size2 0.10.2 impls GetSize for compact_str 0.10, clashing with
# ruff_python_ast's compact_str 0.9 and breaking its GetSize derive.
# Remove once ruff_python_ast/get-size2 agree on a compact_str version.
get-size2 = "=0.10.1"
